name: Trigger auto deployment for aca-nginx-m7wxj6

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/aca-nginx-m7wxj6-AutoDeployTrigger-bea4118c-cb50-400c-bb02-c9b52160dccc.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.ACANGINXM7WXJ6_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.ACANGINXM7WXJ6_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.ACANGINXM7WXJ6_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: docker.io
          registryUsername: ${{ secrets.ACANGINXM7WXJ6_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.ACANGINXM7WXJ6_REGISTRY_PASSWORD }}
          containerAppName: aca-nginx-m7wxj6
          resourceGroup: rg-aca-lab-M7WXJ6
          imageToBuild: antib220/aca-nginx-m7wxj6:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


